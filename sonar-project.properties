# SonarCloud Configuration for Glory Boxing Manager

# Project identification
sonar.projectKey=glory-boxing-manager
sonar.organization=glory-boxing

# Project metadata
sonar.projectName=Glory Boxing Manager
sonar.projectVersion=1.0.0

# Source code location
sonar.sources=src
sonar.tests=src

# Test coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/__tests__/**,**/cypress/**,**/test/**

# TypeScript configuration
sonar.typescript.tsconfigPath=tsconfig.json

# Exclude patterns
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/.next/**,**/coverage/**,**/cypress/**,**/*.config.js,**/*.config.ts

# Quality Gate settings
sonar.qualitygate.wait=true

# Security hotspots
sonar.security.hotspots.reviewed=true

# Code smells
sonar.codeSmells.enabled=true

# Duplications
sonar.cpd.enabled=true
sonar.cpd.javascript.minimumTokens=100

# Maintainability
sonar.maintainability.rating.enabled=true

# Reliability
sonar.reliability.rating.enabled=true

# Security
sonar.security.rating.enabled=true

# Coverage thresholds
sonar.coverage.minimum=80
sonar.coverage.target=90

# Duplication thresholds
sonar.duplicated_lines.density.minimum=3
sonar.duplicated_lines.density.target=1

# Complexity thresholds
sonar.complexity.function.minimum=10
sonar.complexity.function.target=5

# Size thresholds
sonar.size.function.minimum=50
sonar.size.function.target=20 